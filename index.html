<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planet Builder Idle</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0B0E1A;
      color: #E8E8F0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 16px;
      box-sizing: border-box;
    }
    h1 { margin: 0 0 8px; font-size: 2rem; }
    p { margin: 0 0 24px; color: #A8A8B8; }
    a {
      display: inline-block;
      padding: 10px 20px;
      border: 1px solid #E8A0BF;
      border-radius: 999px;
      color: #E8A0BF;
      text-decoration: none;
    }
    a:hover { background: rgba(232, 160, 191, 0.1); }
  </style>
</head>
<body>
  <main>
    <h1>Planet Builder Idle</h1>
    <p>Tap to build planets cell by cell, train robot workers and prestige for more.</p>
    <a href="https://play.google.com/store/apps/details?id=ca.simondery.planetbuilderidle">Get it on Google Play</a>
  </main>
</body>
</html>
